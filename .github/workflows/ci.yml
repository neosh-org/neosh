name: CI

# Every job is one stage of `scripts/check.sh`, which is the whole contract: run it with no
# argument and you have run all of this. The stages are on a runner each so a pull request waits
# for the slowest one rather than the sum of them, and each compiles only what it tests.
#
# Where the time goes, and what is left of it. Compiling the workspace crates is the floor: the
# cache keeps the dependencies and deliberately not the crates — cargo decides freshness by mtime,
# and a checkout gives every file the same one, so a restored crate is either always rebuilt or,
# worse, believed when it should not be. A linker that is not `ld` takes a minute off that floor,
# and `nextest` runs the suites two at a time with a retry, which is what a pty test under load
# needs. Beyond that the lever is the machine: set the repository variable `CI_RUNNER` to a larger
# runner's label and every job moves to it, threads and all.

on:
  push:
    branches: [main]
    # A change that no stage reads is a run that proves nothing — on `main`, where nothing waits on
    # the answer.
    paths-ignore: ["**.md", "website/**"]
  # Not filtered, and it cannot be: `CI passed` is a required check, and a check that never reports
  # on a docs-only pull request is a pull request the merge queue can never take.
  pull_request:
  # The merge queue builds each group on top of `main` and waits for `CI passed` on that, which is
  # what makes it a queue rather than a merge button: two pull requests green on their own and
  # broken together are caught before `main` is.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `.config/nextest.toml`: one retry for the pty suites, and no fail-fast, so one flaky test does
  # not hide a real failure behind it.
  NEXTEST_PROFILE: ci

jobs:
  crates:
    name: Rust crates — tests and generated types
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # This stage never builds the binary, so its dependency set is smaller than the other
          # two's. A key of its own, or whichever job saved first would leave the others short.
          #
          # Bumped once (2026-09-06): a lockfile change misses the exact key and restores the
          # nearest older cache, and the one on the shelf then held `v8`'s build-script fingerprint
          # without the static library it downloads — every build of that job failed at
          # "could not find native static library `rusty_v8`" and, with nothing saved on failure,
          # kept restoring the same broken cache. A new name is a fresh shelf.
          #
          # And again (2026-09-25, all three keys): `toml_edit` joined the lockfile and every Rust
          # job hit the same wall, twice in a row.
          shared-key: crates-3
      - run: ./scripts/check.sh crates

  binary:
    name: neosh binary — tests and scaffold (${{ matrix.slice }}/2)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: binary-2
      - run: ./scripts/check.sh binary ${{ matrix.slice }}/2

  screen:
    name: Bundled plugins on screen (${{ matrix.slice }}/3)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # The same compile as `binary`, so the same cache.
          shared-key: binary-2
      - run: ./scripts/check.sh screen ${{ matrix.slice }}/3

  web:
    name: TypeScript — API, plugins, packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/check.sh web

  # The one check the merge queue requires. One name rather than eight, so a stage added, sliced or
  # renamed changes this list and not the repository's ruleset — and `always()`, so a failure or a
  # cancellation above is reported as a failure here rather than as a check that never ran.
  passed:
    name: CI passed
    if: always()
    needs: [crates, binary, screen, web]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
