[workspace]
resolver = "3"
members = [
    # `plugins/` is a crate because its own directory is what gets embedded — see plugins/lib.rs.
    "plugins",
    "crates/neosh-proto",
    "crates/neosh-core",
    "crates/neosh-provider",
    "crates/neosh-vcs",
    "crates/neosh-swarm",
    "crates/neosh-agent",
    "crates/neosh-script",
    "crates/neosh-tui",
    "crates/neosh-syntax",
    "crates/neosh",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/neoswarm/neosh"
homepage = "https://github.com/neoswarm/neosh"

[workspace.dependencies]
# Every one of these carries a `version` as well as a `path`: cargo refuses to package a crate whose
# dependency has only a path, and the published crate is built against the registry version while
# a checkout is built against the directory next door.
neosh-proto = { path = "crates/neosh-proto", version = "0.5.1" }
neosh-core = { path = "crates/neosh-core", version = "0.5.1" }
neosh-provider = { path = "crates/neosh-provider", version = "0.5.1" }
neosh-vcs = { path = "crates/neosh-vcs", version = "0.5.1" }
neosh-swarm = { path = "crates/neosh-swarm", version = "0.5.1" }
neosh-agent = { path = "crates/neosh-agent", version = "0.5.1" }
neosh-script = { path = "crates/neosh-script", version = "0.5.1" }
neosh-tui = { path = "crates/neosh-tui", version = "0.5.1" }
neosh-syntax = { path = "crates/neosh-syntax", version = "0.5.1" }
neosh-plugins = { path = "plugins", version = "0.5.1" }

# async
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Rewriting `config.toml` from the settings screen without losing a comment somebody wrote in it.
toml_edit = "0.23"
ts-rs = { version = "12", features = ["format", "serde-compat", "no-serde-warnings"] }

# text
unicode-width = "0.2"
unicode-segmentation = "1.13"
smallvec = { version = "1.15", features = ["union", "const_generics"] }

# js runtime
deno_core = "0.410"
# Transpiles TypeScript plugins at load. This is the swc 17 line, which unlike the older one
# pinned by rustyscript builds against current serde.
deno_ast = { version = "0.53", features = ["transpiling"] }
deno_error = "0.7"

# tui
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# net
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs", "charset", "http2"] }
eventsource-stream = "0.2"

# util
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
secrecy = { version = "0.10", features = ["serde"] }
slotmap = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
bytes = "1"
pin-project-lite = "0.2"
shellexpand = "3"
# Content hashing for the project-config trust store.
sha2 = "0.10"
# ASCP node identity. A peer is authorised by its public key being in a list you wrote, so the
# signature check is the whole of the authorisation and there is no CA to run.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
# Embeds the `@neosh/api` source tree so `neosh init` can emit types matching the running binary.
include_dir = "0.7"
# Images. `base64` is how every provider we target wants the bytes; `image` is for sniffing what
# was actually on the clipboard and shrinking a 4K screenshot before it is sent five times.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The terminal's cell size in pixels — `TIOCGWINSZ` — which is what turns a picture's pixels into
# a number of rows. Nothing in crossterm exposes it.
libc = "0.2"

# dev
insta = { version = "1.48", features = ["json", "redactions"] }

[profile.dev]
opt-level = 1
# Enough debug info to read a backtrace, and none of the rest.
#
# A test failure is a file and a line, and `line-tables-only` is exactly that. Full DWARF is what
# a *debugger* needs to show you a local variable, and generating and linking it for eleven crates
# and twenty-eight test binaries is a large share of a build that nothing here ever steps through:
# `rust-cache` deliberately does not cache workspace members, so every CI run pays for all of it
# from scratch. Set it back to `true` in a local override if you are attaching a debugger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Dependencies are cached and never stepped into, so their debug info is weight in every link and
# information nobody reads.
debug = false
